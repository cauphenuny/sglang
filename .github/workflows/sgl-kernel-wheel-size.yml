name: Build sgl-kernel Wheel and Report Size

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  SGLANG_IS_IN_CI: true
  USE_VENV: false

jobs:
  build:
    # Override this with the SGL_KERNEL_BUILD_RUNNER repository variable if
    # your fork uses a different self-hosted runner label.
    runs-on: ${{ vars.SGL_KERNEL_BUILD_RUNNER || 'x64-kernel-build-node' }}
    timeout-minutes: 240
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            cuda-version: "13.0"
    name: Build Wheel and Report Size
    steps:
      - name: Cleanup
        run: |
          if [ -d "$GITHUB_WORKSPACE" ]; then
            sudo rm -rf "$GITHUB_WORKSPACE"/* || true
          else
            echo "$GITHUB_WORKSPACE does not exist, nothing to clean"
          fi

      - uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Free Docker disk space
        run: |
          set -x
          docker image prune -f
          for b in $(docker buildx ls --format '{{.Name}}' | grep -E '^builder-' || true); do
            echo "Removing orphan buildx builder: $b"
            docker buildx rm "$b" || true
          done
          if [ -d "$HOME/.cache/sgl-kernel/buildx/blobs" ]; then
            find "$HOME/.cache/sgl-kernel/buildx/blobs" -type f -mtime +14 -delete
          fi
          df -h /

      - name: Build wheel for Python ${{ matrix.python-version }} and CUDA ${{ matrix.cuda-version }}
        working-directory: sgl-kernel
        run: ./build.sh "${{ matrix.python-version }}" "${{ matrix.cuda-version }}"
        env:
          USE_CCACHE: 1

      - name: Report wheel size
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(sgl-kernel/dist/*.whl)

          if (( ${#wheels[@]} == 0 )); then
            echo "No wheel found in sgl-kernel/dist" >&2
            exit 1
          fi

          {
            echo "## sgl-kernel wheel size"
            echo
            echo '| Wheel | Bytes | MiB |'
            echo '|---|---:|---:|'

            for wheel in "${wheels[@]}"; do
              bytes=$(stat -c '%s' "$wheel")
              mib=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f", bytes / 1024 / 1024 }')
              echo "| $(basename "$wheel") | $bytes | $mib |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-python${{ matrix.python-version }}-cuda${{ matrix.cuda-version }}
          path: sgl-kernel/dist/*.whl
          if-no-files-found: error
